name: "CI: Build & Push Image"

on:
  workflow_run:
    workflows: ["CI: Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BUILD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

concurrency:
  group: production-image-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set_env:
    name: Resolve build environment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    outputs:
      env_var: ${{ steps.environment.outputs.env_var }}
    steps:
      - name: Determine environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_BRANCH" != main ]; then
            echo "Only main may build a production image." >&2
            exit 1
          fi
          echo "env_var=production" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build image — ${{ github.ref_name }} (${{ needs.set_env.outputs.env_var }})
    needs: set_env
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_ENVIRONMENT: ${{ needs.set_env.outputs.env_var }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ needs.set_env.outputs.env_var }}
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      source_sha: ${{ steps.image.outputs.source_sha }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ env.BUILD_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan published image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ env.BUILD_SHA }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

      - name: Record immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${BUILD_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Published ${image_ref}"

      - name: Attest image build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  test-image:
    name: Test published image
    needs: build-image
    uses: ./.github/workflows/ci.test-image.yml
    with:
      image_ref: ${{ needs.build-image.outputs.image_ref }}
    permissions:
      contents: read
      packages: read

  promote-image:
    name: Promote smoke-tested image
    needs: [set_env, build-image, test-image]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image digest
        id: digest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          digest="${IMAGE_REF##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest promoted production image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ needs.set_env.outputs.env_var }}
          subject-digest: ${{ steps.digest.outputs.value }}
          predicate-type: https://in-toto.io/attestation/release/v0.1
          predicate: '{"purl":"pkg:github/${{ github.repository }}@${{ needs.build-image.outputs.source_sha }}"}'
          push-to-registry: true
          create-storage-record: false

      - name: Tag promoted image as latest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ needs.set_env.outputs.env_var }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "$IMAGE_REF"
