name: "CD: Deploy"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable promoted image tag (sha-<40-character commit SHA>).
        required: true
        type: string

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  set_env:
    name: Resolve deploy environment
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.validate.outputs.build_sha }}
      env_var: ${{ steps.environment.outputs.env_var }}
    steps:
      - name: Validate deployment inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[a-f0-9]{40}$ ]]; then
            echo "IMAGE_TAG must be an immutable sha-<commit> tag." >&2
            exit 1
          fi
          echo "build_sha=${IMAGE_TAG#sha-}" >> "$GITHUB_OUTPUT"

      - name: Determine environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          echo "env_var=production" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production image
    needs: set_env
    runs-on: mcp
    environment: ${{ needs.set_env.outputs.env_var }}
    timeout-minutes: 20
    env:
      BUILD_SHA: ${{ needs.set_env.outputs.build_sha }}
      DEPLOY_BRANCH: main
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ needs.set_env.outputs.env_var }}
    steps:

      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          # The ancestry check below needs the complete main history, not the
          # default one-commit checkout.
          fetch-depth: 0
          sparse-checkout: docker-compose.production.yml
          sparse-checkout-cone-mode: false

      - name: Require a main-branch source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEPLOY_BRANCH"
          git merge-base --is-ancestor "$BUILD_SHA" "origin/$DEPLOY_BRANCH"
          echo "${BUILD_SHA} is reachable from ${DEPLOY_BRANCH}; production deployment allowed."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          # `imagetools inspect` does not expose a descriptor digest for every
          # single-platform manifest. Pulling first gives Docker the registry's
          # canonical RepoDigest for either a single- or multi-platform image.
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          image_ref="$(docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format '{{index .RepoDigests 0}}')"
          digest="${image_ref##*@}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unable to resolve a digest for ${IMAGE_NAME}:${IMAGE_TAG}." >&2
            exit 1
          fi
          if [ "$image_ref" != "${IMAGE_NAME}@${digest}" ]; then
            echo "Resolved image does not belong to ${IMAGE_NAME}." >&2
            exit 1
          fi
          echo "IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
          # Compose interpolation happens afresh in every Actions step,
          # including failure diagnostics. Persist the exact same immutable
          # image reference so logs and recovery commands see this stack.
          echo "REDMINE_MCP_IMAGE=${image_ref}" >> "$GITHUB_ENV"

      - name: Verify image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.build.yml"

      - name: Write runtime configuration
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          set -euo pipefail
          test -n "$ENV_FILE"
          umask 077
          printf '%s\n' "$ENV_FILE" > .env

      - name: Write runtime secret files
        shell: bash
        env:
          INTROSPECT_CLIENT_SECRET: ${{ secrets.REDMINE_INTROSPECT_CLIENT_SECRET }}
          MCP_JWT_SIGNING_KEY: ${{ secrets.REDMINE_MCP_JWT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$INTROSPECT_CLIENT_SECRET"
          test -n "$MCP_JWT_SIGNING_KEY"

          # This directory is unique to this deployment and is removed after
          # the diagnostics step. Docker Compose copies each file into the
          # container as a read-only /run/secrets/<name> mount.
          secret_dir="$RUNNER_TEMP/redmine-mcp-server-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$secret_dir"
          umask 077
          printf '%s' "$INTROSPECT_CLIENT_SECRET" > "$secret_dir/redmine_introspect_client_secret"
          printf '%s' "$MCP_JWT_SIGNING_KEY" > "$secret_dir/redmine_mcp_jwt_signing_key"
          echo "REDMINE_INTROSPECT_SECRET_PATH=$secret_dir/redmine_introspect_client_secret" >> "$GITHUB_ENV"
          echo "REDMINE_MCP_JWT_SIGNING_KEY_PATH=$secret_dir/redmine_mcp_jwt_signing_key" >> "$GITHUB_ENV"
          echo "RUNTIME_SECRETS_DIR=$secret_dir" >> "$GITHUB_ENV"

      - name: Pull and deploy verified image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.production.yml pull
          docker compose -f docker-compose.production.yml up -d \
            --force-recreate --wait --wait-timeout 120 --remove-orphans

      - name: Verify local health endpoint
        shell: bash
        run: docker compose -f docker-compose.production.yml exec -T redmine-mcp-server curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/health >/dev/null

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REDMINE_INTROSPECT_SECRET_PATH:-}" || -z "${REDMINE_MCP_JWT_SIGNING_KEY_PATH:-}" ]]; then
            echo "Skipping Compose logs: runtime secret files were not created."
            exit 0
          fi
          docker compose -f docker-compose.production.yml logs --no-color --tail=200

      - name: Remove runtime secret files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNTIME_SECRETS_DIR:-}" ]]; then
            exit 0
          fi
          expected_prefix="$RUNNER_TEMP/redmine-mcp-server-secrets-"
          if [[ "$RUNTIME_SECRETS_DIR" != "$expected_prefix"* ]]; then
            echo "Refusing to remove an unexpected secrets directory." >&2
            exit 1
          fi
          rm -f "$RUNTIME_SECRETS_DIR/redmine_introspect_client_secret"
          rm -f "$RUNTIME_SECRETS_DIR/redmine_mcp_jwt_signing_key"
          rmdir "$RUNTIME_SECRETS_DIR" 2>/dev/null || true
