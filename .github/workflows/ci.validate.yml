name: "CI: Validate"

on:
  workflow_dispatch:
  schedule:
    # Recheck the lockfile and vulnerability database even when source has not changed.
    - cron: "0 8 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install locked test environment
        run: uv sync --locked --extra test
      - name: Generate test TLS certificates
        run: bash tests/fixtures/ssl/generate-test-certs.sh
      - name: Run tests
        run: uv run pytest -m "not integration" tests/

  quality-and-security:
    name: Lint, lockfile, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --locked --extra test --extra dev
      - name: Check formatting and linting
        run: |
          uv run black --check src/ tests/
          uv run flake8 src/ tests/ --max-line-length=88
      - name: Audit production dependencies
        run: |
          uv tool run pip-audit --version
          uv export --no-hashes --no-emit-project > /tmp/requirements-audit.txt
          bash scripts/audit.sh -r /tmp/requirements-audit.txt --strict
