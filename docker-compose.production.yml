services:
  redmine-mcp-server:
    # CI supplies this as ghcr.io/vilnius-vmsa/redmine-mcp-server-production@sha256:... .
    # A digest, rather than a tag, makes the deployed artifact immutable.
    image: "${REDMINE_MCP_IMAGE:?Set REDMINE_MCP_IMAGE to an immutable image digest}"
    pull_policy: always
    container_name: redmine-mcp-server
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Explicit empty values override any legacy inline entries in `.env`;
      # get_secret() then falls back to the corresponding *_FILE value.
      REDMINE_INTROSPECT_CLIENT_SECRET: ""
      REDMINE_INTROSPECT_CLIENT_SECRET_FILE: /run/secrets/redmine_introspect_client_secret
      REDMINE_MCP_JWT_SIGNING_KEY: ""
      REDMINE_MCP_JWT_SIGNING_KEY_FILE: /run/secrets/redmine_mcp_jwt_signing_key
    # Production credentials are files, not container environment variables.
    # The manual deploy workflow creates these files from GitHub Environment
    # secrets immediately before `docker compose up`.
    secrets:
      - redmine_introspect_client_secret
      - redmine_mcp_jwt_signing_key
    volumes:
      # Named volumes inherit /app ownership from the image on first use,
      # unlike host bind mounts, which may be owned by root.
      - redmine_mcp_production_logs:/app/logs
      - redmine_mcp_production_data:/app/data
    restart: unless-stopped
    networks:
      - redmine-mcp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  redmine-mcp-network:
    driver: bridge

volumes:
  # Explicit names survive a checkout-path or Compose project-name change.
  # Do not remove the data volume: OAuthProxy stores encrypted state there.
  redmine_mcp_production_logs:
    name: redmine-mcp-production-logs
  redmine_mcp_production_data:
    name: redmine-mcp-production-data

secrets:
  redmine_introspect_client_secret:
    file: "${REDMINE_INTROSPECT_SECRET_PATH:?Set REDMINE_INTROSPECT_SECRET_PATH to the runtime secret file}"
  redmine_mcp_jwt_signing_key:
    file: "${REDMINE_MCP_JWT_SIGNING_KEY_PATH:?Set REDMINE_MCP_JWT_SIGNING_KEY_PATH to the runtime secret file}"
